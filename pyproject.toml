[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "statebudget-nav"
version = "0.1.0.dev3"
description = "Explicit serialized persistent-state budgets and restart audits for navigation research"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "gymnasium>=0.29", "minigrid>=2.3"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/yellowhcj/statebudget-nav"
Issues = "https://github.com/yellowhcj/statebudget-nav/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
statebudget-nav = "statebudget_nav.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["statebudget_nav", "statebudget_nav._core", "statebudget_nav.examples"]
namespaces = false

[tool.setuptools.package-data]
"statebudget_nav._core" = ["provenance.json"]
